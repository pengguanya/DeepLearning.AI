<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Stadt-Rennen mit runden Kurven</title>
    <style>
        body { text-align: center; background: #222; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { background: #2ecc71; border: 10px solid #27ae60; display: block; margin: 10px auto; box-shadow: 0 0 30px rgba(0,0,0,0.7); }
        .info { font-size: 20px; font-weight: bold; color: yellow; text-shadow: 2px 2px 4px #000; }
    </style>
</head>
<body>
    <h1>🏙️ Stadt-Rennen 🏎️</h1>
    <div class="info" id="status">Fahr los!</div>
    <canvas id="gameCanvas" width="600" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let carX = 300;
        let distance = 0;
        let speed = 0;
        let finishLine = 3500; // Strecke ist jetzt 3500 "Meter" lang

        // Wolkenkratzer erstellen
        let buildings = [];
        for(let i=0; i<6; i++) {
            buildings.push({
                x: i % 2 === 0 ? 30 : 530, 
                y: i * 120,               
                width: 50 + Math.random() * 30, 
                height: 60 + Math.random() * 40, 
                color: Math.random() > 0.5 ? '#555' : '#777' 
            });
        }

        // --- HIER IST DER NEUE KURVEN-TRICK! ---
        function getTrackCurve(z) {
            let x = 300; // Start in der Mitte

            // 1. Kurve nach links (weich und rund)
            if (z > 300 && z < 1100) {
                let prozent = (z - 300) / 800; // Wie weit sind wir in der Kurve? (0 bis 1)
                // Math.sin macht die perfekte runde Biegung!
                x = x - Math.sin(prozent * Math.PI) * 160; 
            }
            // 2. Große Kurve nach rechts
            else if (z > 1300 && z < 2300) {
                let prozent = (z - 1300) / 1000;
                x = x + Math.sin(prozent * Math.PI) * 180;
            }
            // 3. Etwas schärfere, aber runde Kurve nach links
            else if (z > 2500 && z < 3200) {
                let prozent = (z - 2500) / 700;
                x = x - Math.sin(prozent * Math.PI) * 140;
            }

            return x;
        }
        // ---------------------------------------

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Wolkenkratzer zeichnen
            buildings.forEach((b) => {
                b.y += speed * 0.8; 
                if(b.y > 700) {
                    b.y = -100; 
                    b.x = Math.random() > 0.5 ? 30 : 530; 
                }
                ctx.fillStyle = "rgba(0,0,0,0.3)";
                ctx.fillRect(b.x + 10, b.y + 10, b.width, b.height);
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.width, b.height);
                if(b.width > 70) {
                    ctx.fillStyle = "white";
                    ctx.font = "30px Arial";
                    ctx.fillText("H", b.x + b.width/2 - 10, b.y + b.height/2 + 10);
                }
            });

            // Straße zeichnen
            ctx.beginPath();
            ctx.strokeStyle = "#555";
            ctx.lineWidth = 140;
            for (let i = 0; i < 110; i++) { 
                let trackZ = distance + (100 - i) * 6;
                let x = getTrackCurve(trackZ);
                if (i === 0) ctx.moveTo(x, i * 6);
                else ctx.lineTo(x, i * 6);
            }
            ctx.stroke();

            // Mittellinie
            ctx.beginPath();
            ctx.setLineDash([20, 30]);
            ctx.strokeStyle = "#FFF";
            ctx.lineWidth = 4;
             for (let i = 0; i < 110; i++) {
                let trackZ = distance + (100 - i) * 6;
                let x = getTrackCurve(trackZ);
                 if (i === 0) ctx.moveTo(x, i * 6);
                else ctx.lineTo(x, i * 6);
            }
            ctx.stroke();
            ctx.setLineDash([]);

            // Ziel
            if (distance > finishLine - 700) {
                let finishX = getTrackCurve(finishLine);
                for(let k=0; k<10; k++) {
                     ctx.fillStyle = k % 2 === 0 ? "white" : "black";
                     ctx.fillRect(finishX - 70 + (k*14), 600 - (finishLine - distance), 14, 20);
                }
                if(distance < finishLine) document.getElementById("status").innerText = "Gleich da!";
            }

            // Auto
            ctx.fillStyle = "red"; 
            ctx.fillRect(carX - 15, 500, 30, 50);
            ctx.fillStyle = "black"; 
            ctx.fillRect(carX - 10, 510, 20, 15);

            // Logik (Gras oder Straße?)
            let currentTrackX = getTrackCurve(distance + 100);
            let diff = Math.abs(carX - currentTrackX);
            
            if (distance >= finishLine) {
                speed = 0;
                document.getElementById("status").innerText = "🏆 ZIEL ERREICHT! 🏆";
                document.getElementById("status").style.color = "#2ecc71";
            } else if (diff > 65) {
                speed = 3; 
                document.getElementById("status").innerText = "Achtung: GRAS!";
                document.getElementById("status").style.color = "orange";
            } else {
                let nextTrackX = getTrackCurve(distance + 200);
                if(Math.abs(currentTrackX - nextTrackX) < 5) {
                     speed = 10; 
                     document.getElementById("status").innerText = "VOLLGAS GERADEAUS!";
                } else {
                     speed = 7; 
                     document.getElementById("status").innerText = "Schöne Kurve...";
                }
                document.getElementById("status").style.color = "yellow";
            }
            if(distance < finishLine) distance += speed;

            requestAnimationFrame(draw);
        }

        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") carX -= 20;
            if (e.key === "ArrowRight") carX += 20;
        });

        draw();
    </script>
</body>
</html>
